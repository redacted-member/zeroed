[package]
name = "carve-core"
description = "Zeroed kernel: geometry, relief model, CAM, document and file format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cavalier_contours = "0.9"
delaunator = "1"
dirs = "6"
dxf = { version = "0.6", default-features = false }
flate2 = "1"
i_overlay = "9"
lopdf = { version = "=0.45.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif", "tiff"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
rayon = "1"
roxmltree = "0.20"
rustybuzz = "0.20"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = { version = "5", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The independent G-code checker the post tests run every shipped post
# through; it shares no code with this crate.
gcode-check = { path = "../../tools/gcode-check" }
